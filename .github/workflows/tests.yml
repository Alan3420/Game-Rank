name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # Las dos baterias van por separado: el conftest de tests/ sustituye modulos por mocks
      - name: Tests unitarios
        run: python -m pytest tests -q
      - name: Tests de contrato de la API
        run: python -m pytest tests_contrato -q
